# Cad-lite English catalog (source language).
#
# Key = table path + leaf name. Values use fmt verbs (%s, %d, %q, %v); %[2]s reorders arguments.
# A string used WITHOUT arguments is returned as written, so a literal percent sign is a single %;
# a string used WITH arguments needs %%. Keys ending in _one/_other are plural forms (i18n.Plural).
# Keyword values (table [kw]) mark shortcut letters with capitals.
# cmd.<name>.aliases are extra typed names for the command (arrays).
# it.toml must define exactly the same keys with the same placeholders: go run ./i18n/cmd/i18ncheck
