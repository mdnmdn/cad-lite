[cmd.extend]
name = "Extend"
desc = "Extends objects up to the boundary edges"
tip = "Extend — extends objects up to the boundary edges (EXTEND / EX)"
aliases = ["EX"]

[cmd.break]
name = "Break"
desc = "Breaks an object between two points"
tip = "Break — breaks an object between two points (BREAK / BR)"
aliases = ["BR"]

[cmd.breakatpoint]
name = "Break at point"
desc = "Splits an object in two at one point"
tip = "Break at point — splits an object in two at one point (BREAKATPOINT)"
aliases = []

[cmd.join]
name = "Join"
desc = "Joins objects that touch end to end into one"
tip = "Join — joins objects that touch end to end into one (JOIN / J)"
aliases = ["J"]

[cmd.explode]
