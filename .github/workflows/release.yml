name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0, no leading v). Creates tag v<version> and publishes the release; empty only builds"
        required: false
        default: ""
      macos:
        description: "Build macOS (universal Intel and Apple Silicon)"
        type: boolean
        required: false
        default: true
      windows:
        description: "Build Windows (x64)"
        type: boolean
        required: false
        default: true
      linux:
        description: "Build Linux (x64)"
        type: boolean
        required: false
        default: true
      draft:
        description: "Keep the release as a draft (the tag is created when you publish it)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CGO_ENABLED: "0"

jobs:
  # Validate manual platform selection and any release version before anything is built.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one platform
        if: github.event_name == 'workflow_dispatch' && !inputs.macos && !inputs.windows && !inputs.linux
        run: |
          echo "::error::Select at least one platform to build"
          exit 1
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        with:
          fetch-depth: 0
      - name: Validate the version and that its tag is new
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc1, without a leading v (got '$VERSION')"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

  macos:
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pure-Go darwin builds (ebiten uses purego there), so both arches cross-compile on one
      # runner and are merged into a universal binary with lipo.
      - name: Assemble Cad-lite.app
        run: ARCHS="arm64 amd64" packaging/macos/bundle.sh
      - name: Sign, notarize when APPLE_* secrets exist, zip and dmg
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            _tmp/dist/macos/*.zip
            _tmp/dist/macos/*.dmg

  windows:
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build x64 exe and zip
        run: ARCHS=amd64 packaging/windows/bundle.sh
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build x64 installer
        shell: pwsh
        run: |
          $v = (Get-ChildItem _tmp/dist/windows -Filter 'cad-lite-*-windows-amd64.zip').Name -replace '^cad-lite-(.*)-windows-amd64\.zip$', '$1'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$v" "/DMyArch=amd64" packaging\windows\cad-lite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Authenticode signing is not wired: see packaging/README.md.
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            _tmp/dist/windows/*.zip
            _tmp/dist/windows/*-setup.exe

  linux:
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6-dev libgl1-mesa-dev libx11-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev pkg-config librsvg2-bin
      - name: Build x64 tar.gz
        run: GOARCH=amd64 CGO_ENABLED=1 packaging/linux/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: _tmp/dist/linux/*.tar.gz

  # Publishes on a pushed v* tag, or on a manual run with a version: that run creates the tag
  # v<version> on the commit it built (when the release is published, if it is kept as a draft).
  publish:
    needs: [check, macos, windows, linux]
    # !cancelled() permits skipped dependencies; only unselected platforms may be skipped.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      needs.macos.result == (github.event_name == 'workflow_dispatch' && !inputs.macos && 'skipped' || 'success') &&
      needs.windows.result == (github.event_name == 'workflow_dispatch' && !inputs.windows && 'skipped' || 'success') &&
      needs.linux.result == (github.event_name == 'workflow_dispatch' && !inputs.linux && 'skipped' || 'success') &&
      (needs.macos.result == 'success' || needs.windows.result == 'success' || needs.linux.result == 'success') &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The in-app updater verifies its download against this file (updater.ChecksumFiles),
      # so it must list every archive; keep the name.
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name, '-') }}
