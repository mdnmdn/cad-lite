# Every icon Cad-lite draws.
#
# A key is the file name (`assets/icons/<key>.svg`), the icon's name in the registry and the Go
# constant in names_gen.go — one spelling, kebab-case `<category>-<thing>`, no synonyms. The value
# is the icon's *goal*: what a reader has to understand from it, in one line. Write the goal
# before drawing anything; a goal you cannot state in a line is a concept that is not settled.
#
# Longer entries take a mapping instead of the bare string:
#   source:   `custom` (the default) — we drew it.
#             `adopted:<lucide-name>` — started as a Lucide icon (ISC, see LICENSE-lucide) and now
#             lives here, rewritten on our root by `just icons-adopt`. The provenance stays in the
#             row. Adopted geometry is exempt from the shape-count, ink-envelope and decimals
#             rules, because it is coherent by construction.
#   keywords: what someone would search for. Grep these before drawing a new icon; a hit means
#             the icon exists under another name.
#
# `canon` is the frozen reference strip: approved, never redrawn. Every review sheet carries it
# so a new icon is judged against a fixed point, not against the last batch.
#
# `just icons-check` keeps this file, the directory and names_gen.go honest. A row with no file
# yet is a worklist entry, not a failure.

canon: [draw-line, draw-circle, draw-rectangle, snap-ortho]

categories:
  draw:
    draw-line:
      goal: a straight segment between two picked points
      keywords: [line, segment, stroke]
    draw-polyline:
      goal: a connected chain of segments, one of them an arc, with a grip at every picked vertex
      keywords: [pline, polyline, path, zigzag]
    draw-circle:
      goal: a circle placed by its centre point
      keywords: [circle, ring, round]
    draw-arc:
      goal: a curved piece of a circle through three picked points (start, middle, end)
      keywords: [arc, curve, bend]
    draw-rectangle:
      goal: an axis-aligned rectangle from two opposite corners
      keywords: [rectang, rect, box, square]
    draw-polygon:
      goal: a regular polygon, drawn as a hexagon
      keywords: [polygon, hexagon, regular]
    draw-ellipse:
      goal: an ellipse with its centre marked
      keywords: [ellipse, oval]

  modify:
    modify-move:
      goal: shift the selection to another place without changing it
      keywords: [move, translate, shift, four arrows, displacement]
    modify-copy:
      goal: duplicate the selection, leaving the original where it is
      keywords: [copy, duplicate, clone]
    modify-rotate:
      goal: turn the selection around a base point
      keywords: [rotate, turn, spin, base point]
    modify-scale:
      goal: make the selection bigger or smaller about a base point
      keywords: [scale, resize, grow, shrink]
    modify-erase:
      goal: remove the selection from the drawing
      source: adopted:eraser
      keywords: [erase, delete, remove, rubber]
    modify-mirror:
      goal: reflect the selection across an axis, shown as a dashed line
      keywords: [mirror, reflect, flip, symmetry, axis]
    modify-offset:
      goal: a parallel copy of a curve at a set distance
      keywords: [offset, parallel, concentric, distance]
    modify-fillet:
      goal: two lines joined by a rounded corner
      keywords: [fillet, round corner, radius]
    modify-chamfer:
      goal: two lines joined by a bevelled corner
      keywords: [chamfer, bevel, cut corner]
    modify-trim:
      goal: cut a line back to a cutting edge, the removed part dotted
      keywords: [trim, cut, cutting edge, clip]
    modify-extend:
      goal: lengthen a line up to a boundary edge, the new part dotted
      keywords: [extend, lengthen, boundary, stretch to]
    modify-break:
      goal: split a line, leaving a gap between two grips
      keywords: [break, gap, split, cut]
    modify-join:
      goal: two segments merge into one
      keywords: [join, merge, connect, weld]
    modify-explode:
      goal: a polyline falls apart into separate segments
      keywords: [explode, burst, split apart, ungroup]
    modify-stretch:
      goal: pull the part of the geometry inside a crossing window
      keywords: [stretch, crossing window, pull]

  edit:
    edit-undo:
      goal: take back the last change
      source: adopted:undo-2
      keywords: [undo, back, revert]
    edit-redo:
      goal: bring back the change that was just taken back
      source: adopted:redo-2
      keywords: [redo, forward, reapply]

  view:
    view-zoom:
      goal: change the magnification of the view
      keywords: [zoom, magnifier, realtime, in, out]
    view-zoom-extents:
      goal: fit the whole drawing in the window
      keywords: [zoom extents, fit, all, maximize]
    view-zoom-window:
      goal: zoom into a window the reader picks
      keywords: [zoom window, magnifier, window, search]
    view-pan:
      goal: slide the view around without changing the drawing
      source: adopted:hand
      keywords: [pan, hand, drag view]
    view-grid:
      goal: the background grid, shown or hidden
      source: adopted:grid-3x3
      keywords: [grid, lattice, grid display]

  snap:
    snap-osnap:
      goal: the pointer locks onto exact points of existing geometry
      keywords: [osnap, object snap, endpoint, marker]
    snap-ortho:
      goal: movement is held to right angles, horizontal and vertical only
      keywords: [ortho, orthogonal, right angle, perpendicular]
    snap-polar:
      goal: movement locks to angle increments around the start point
      keywords: [polar, polar tracking, angle increment, rays]
    snap-grid:
      goal: the pointer jumps from grid point to grid point
      keywords: [snap, grid snap, snap mode, dots, cursor]
    snap-otrack:
      goal: dotted tracking lines run from acquired points to the pointer
      keywords: [otrack, object snap tracking, tracking, alignment]
    snap-dyn:
      goal: values appear in a box beside the pointer for typing
      keywords: [dyn, dynamic input, tooltip, cursor]
    snap-lwt:
      goal: lines are shown with their weight, thin to thick
      keywords: [lwt, lineweight, thickness, thick line]

  measure:
    measure-distance:
      goal: the length between two picked points, as a dimension line
      keywords: [dist, distance, length, dimension, ruler]
    measure-area:
      goal: the surface enclosed by a closed outline
      keywords: [area, surface, hatch, polygon]
    measure-angle:
      goal: the opening between two lines
      source: adopted:angle
      keywords: [angle, degrees, corner]
    measure-radius:
      goal: the radius of a circle or arc
      keywords: [radius, circle, diameter]
    measure-id-point:
      goal: report the coordinates of a picked point
      source: adopted:crosshair
      keywords: [id, point, coordinates, crosshair, locate]

  layer:
    layer-visible:
      goal: the layer is on, a lit bulb
      keywords: [visible, show, on, bulb, lamp]
    layer-hidden:
      goal: the layer is off, a dark bulb
      keywords: [hidden, hide, off, bulb]
    layer-current:
      goal: the layer new geometry goes on, a stack of sheets
      source: adopted:layers
      keywords: [layer, current, stack, properties]
    layer-frozen:
      goal: the layer is frozen, a snowflake
      keywords: [freeze, frozen, snowflake, cold]
    layer-thawed:
      goal: the layer is thawed, a sun
      keywords: [thaw, thawed, sun, warm]
    layer-locked:
      goal: the layer is locked against edits, a closed padlock
      keywords: [lock, locked, padlock, protect]
    layer-unlocked:
      goal: the layer can be edited, an open padlock
      keywords: [unlock, unlocked, open padlock]

  file:
    file-open:
      goal: choose a drawing file to open, an open folder
      keywords: [open, folder, load, browse, file]
    file-save:
      goal: write the drawing to its file, a floppy disk
      keywords: [save, floppy, disk, write, store]

  app:
    app-settings:
      goal: open the settings panel
      source: custom
      keywords: [settings, preferences, options, gear, cog, theme]
